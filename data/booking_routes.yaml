# Verified alternate booking and contact paths for inns researched through the
# planner. This file deliberately stores routes and stable provider IDs, never
# a claim that a room is available. Refresh `verified_on` when a route changes.
#
# `jalan_legacy_api` needs a pre-existing Jalan Web Service key: Recruit has
# closed new registrations. It can return Jalan channel stock and a redirect,
# but cannot make a booking or contact an inn.

